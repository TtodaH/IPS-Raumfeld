<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Raumfeld</title>
<script>
(function () {
    function parseHex(v) {
        if (!v) return null;
        var h = String(v).trim().replace('#', '');
        if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
        if (!/^[0-9a-f]{6}$/i.test(h)) return null;
        return { r: parseInt(h.substr(0,2),16), g: parseInt(h.substr(2,2),16), b: parseInt(h.substr(4,2),16) };
    }
    function lum(c) {
        function ch(x){ x/=255; return x<=0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055,2.4); }
        return 0.2126*ch(c.r)+0.7152*ch(c.g)+0.0722*ch(c.b);
    }
    var p = new URLSearchParams(location.search);
    var card = parseHex(p.get('cardcolor')), text = parseHex(p.get('textcolor'));
    var isLight = card ? lum(card) > 0.45 : (text ? lum(text) < 0.45 : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
    var root = document.documentElement;
    root.setAttribute('data-theme', isLight ? 'light' : 'dark');
    if (card) root.style.setProperty('--card', 'rgb('+card.r+','+card.g+','+card.b+')');
    if (text) root.style.setProperty('--text', 'rgb('+text.r+','+text.g+','+text.b+')');
})();
</script>
<style>
:root {
    --accent: #00CDAB; --card: #1b1d22; --text: #f4f6f8; --muted: #98a2b3;
    --track: rgba(255,255,255,.16); --chip: rgba(255,255,255,.07); --chip-b: rgba(255,255,255,.13);
}
:root[data-theme="light"] {
    --card:#fff; --text:#111827; --muted:#5b6472;
    --track: rgba(17,24,39,.16); --chip: rgba(17,24,39,.05); --chip-b: rgba(17,24,39,.13);
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; max-width: 100%; height: 100%; overflow: hidden; background: var(--card); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

.tile { width: 100%; max-width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between;
    gap: 3px; padding: 4px 7px; overflow: hidden; }

/* Der grosse Titel oben im Bild ist IP-Symcon-Chrome (Objektname) - hier nur Untertitel */
.head { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; width: 100%; max-width: 100%; overflow: hidden; }
.sub { flex: 1 1 auto; min-width: 0; font-size: 11px; color: var(--muted); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hbtn { flex: 0 0 auto; width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 1px solid var(--chip-b);
    background: var(--chip); color: var(--muted); font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-family: inherit; }
.hbtn:active { transform: scale(.94); }
.hbtn.on { background: color-mix(in srgb, var(--accent) 26%, transparent); color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.hbtn.mute-on { background: color-mix(in srgb, #ff6b6b 24%, transparent); color: #ff9a9a; border-color: rgba(255,107,107,.45); }

.body { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 3px;
    width: 100%; max-width: 100%; min-height: 0; overflow: hidden; }
.row { display: flex; align-items: center; gap: 5px; width: 100%; max-width: 100%; min-width: 0; flex: 0 0 auto; }
.lbl { font-size: 10px; color: var(--muted); flex: 0 0 40px; white-space: nowrap; }
.value { font-size: 11px; font-variant-numeric: tabular-nums; flex: 0 0 32px; text-align: right; }

input[type=range] { -webkit-appearance: none; appearance: none; flex: 1 1 auto; min-width: 0; width: 100%;
    max-width: 100%; height: 18px; margin: 0; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--track); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: none; margin-top: -5px; }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: none; }

select { flex: 1 1 auto; min-width: 0; width: 100%; max-width: 100%; padding: 3px 5px; border-radius: 6px;
    font-size: 11px; font-family: inherit; background: var(--chip); color: var(--text);
    border: 1px solid var(--chip-b); cursor: pointer; text-overflow: ellipsis; }

.foot { display: flex; align-items: center; gap: 3px; flex: 0 0 auto; width: 100%; max-width: 100%; overflow: hidden; }
.pbtn { flex: 1 1 0; min-width: 0; height: 24px; padding: 0; border-radius: 6px; border: 1px solid var(--chip-b);
    background: var(--chip); color: var(--text); font-size: 11px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-family: inherit; }
.pbtn:active { transform: scale(.95); filter: brightness(1.25); }
.pbtn.active { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 50%, transparent); }

.hide { display: none !important; }

/* Stufen per JS: bei wenig Hoehe ausblenden statt abschneiden */
body.lvl-tiny .foot, body.lvl-tiny .row-source, body.lvl-tiny .lbl { display: none; }
body.lvl-micro .foot, body.lvl-micro .row-source, body.lvl-micro .lbl, body.lvl-micro .value { display: none; }
</style>
</head>
<body>
<div class="tile">
    <div class="head">
        <div class="sub" id="tSub"></div>
        <button class="hbtn" id="btnMute" title="Stumm">&#128266;</button>
        <button class="hbtn" id="btnPower" title="Ein/Aus">&#9211;</button>
    </div>
    <div class="body">
        <div class="row" id="rowVolume">
            <span class="lbl">Lautst.</span>
            <input type="range" id="vol" min="0" max="100" step="1">
            <span class="value" id="volVal">--</span>
        </div>
        <div class="row row-source" id="rowSource">
            <span class="lbl">Quelle</span>
            <select id="src"></select>
        </div>
    </div>
    <div class="foot" id="rowPlay">
        <button class="pbtn" id="btnPrev">&#9198;</button>
        <button class="pbtn" id="btnPlay">&#9654;</button>
        <button class="pbtn" id="btnStop">&#9632;</button>
        <button class="pbtn" id="btnNext">&#9197;</button>
    </div>
</div>
<script>
var state = { power:false, volume:0, mute:false, source:0, sources:{}, transport:'' };
var volTimer = null;
var ICON_VOL = '&#128266;';
var ICON_MUTE = '&#128263;';

function applyLevel() {
    var h = document.documentElement.clientHeight || window.innerHeight || 0;
    var b = document.body;
    b.classList.remove('lvl-tiny', 'lvl-micro');
    if (h > 0 && h < 105) b.classList.add('lvl-micro');
    else if (h > 0 && h < 150) b.classList.add('lvl-tiny');
}
if (window.ResizeObserver) new ResizeObserver(applyLevel).observe(document.documentElement);
window.addEventListener('resize', applyLevel);
window.addEventListener('load', applyLevel);
applyLevel();

function setText(id, v) { var el = document.getElementById(id); if (el && el.textContent !== String(v)) el.textContent = v; }

function handleMessage(data) {
    if (!data) return;
    var p = data;
    if (typeof data === 'string') { try { p = JSON.parse(data); } catch (e) { return; } }
    if (p.accentColor) document.documentElement.style.setProperty('--accent', p.accentColor);

    var btnPower = document.getElementById('btnPower');
    var btnMute = document.getElementById('btnMute');

    if (!p.available) {
        setText('tSub', p.status || 'Keine Renderer-Instanz');
        btnPower.classList.remove('on');
        applyLevel();
        return;
    }

    state.power = !!p.power; state.volume = p.volume | 0; state.mute = !!p.mute;
    state.source = p.source | 0; state.sources = p.sources || {}; state.transport = p.transport || '';

    var parts = [];
    if (p.subtitle) parts.push(p.subtitle);
    if (p.status) parts.push(p.status);
    setText('tSub', parts.join(' \u00b7 '));

    btnPower.classList.toggle('on', state.power);
    btnMute.classList.toggle('mute-on', state.mute);
    btnMute.innerHTML = state.mute ? ICON_MUTE : ICON_VOL;
    btnMute.classList.toggle('hide', !p.showMute);
    document.getElementById('rowVolume').classList.toggle('hide', !p.showVolume);
    document.getElementById('rowSource').classList.toggle('hide', !p.showSource);
    document.getElementById('rowPlay').classList.toggle('hide', !p.showPlayback);

    if (!volTimer) {
        document.getElementById('vol').value = state.volume;
        setText('volVal', state.volume + ' %');
    }

    var sel = document.getElementById('src');
    var keys = Object.keys(state.sources);
    if (sel.options.length !== keys.length) {
        sel.innerHTML = keys.map(function (k) { return '<option value="'+k+'">'+state.sources[k]+'</option>'; }).join('');
    }
    if (sel.value !== String(state.source)) sel.value = String(state.source);

    var playing = state.transport === 'PLAYING';
    var btnPlay = document.getElementById('btnPlay');
    btnPlay.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    btnPlay.classList.toggle('active', playing);
    applyLevel();
}

function send(ident, value) { if (typeof requestAction === 'function') requestAction(ident, value); }

document.getElementById('btnPower').addEventListener('click', function () { send('power', !state.power); });
document.getElementById('btnMute').addEventListener('click', function () { send('mute', !state.mute); });
document.getElementById('vol').addEventListener('input', function () {
    setText('volVal', this.value + ' %');
    if (volTimer) clearTimeout(volTimer);
    volTimer = setTimeout(function () { volTimer = null; }, 1200);
});
document.getElementById('vol').addEventListener('change', function () { send('volume', parseInt(this.value, 10)); });
document.getElementById('src').addEventListener('change', function () { send('source', parseInt(this.value, 10)); });
document.getElementById('btnPrev').addEventListener('click', function () { send('playback', 0); });
document.getElementById('btnPlay').addEventListener('click', function () { send('playback', state.transport === 'PLAYING' ? 3 : 2); });
document.getElementById('btnStop').addEventListener('click', function () { send('playback', 1); });
document.getElementById('btnNext').addEventListener('click', function () { send('playback', 4); });

if (window.__INITIAL_DATA__) handleMessage(window.__INITIAL_DATA__);
</script>
</body>
</html>
