<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Raumfeld</title>
<script>
(function () {
    'use strict';
    function parseHex(v) {
        if (!v) return null;
        var h = String(v).trim();
        if (h.charAt(0) === '#') h = h.substring(1);
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        if (!/^[0-9a-f]{6}$/i.test(h)) return null;
        return { r: parseInt(h.substr(0, 2), 16), g: parseInt(h.substr(2, 2), 16), b: parseInt(h.substr(4, 2), 16) };
    }
    function lum(c) {
        function ch(x) { x = x / 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }
        return 0.2126 * ch(c.r) + 0.7152 * ch(c.g) + 0.0722 * ch(c.b);
    }
    var p = new URLSearchParams(window.location.search);
    var card = parseHex(p.get('cardcolor'));
    var text = parseHex(p.get('textcolor'));
    var isLight = null;
    if (card) { isLight = lum(card) > 0.45; }
    else if (text) { isLight = lum(text) < 0.45; }
    else if (window.matchMedia) { isLight = window.matchMedia('(prefers-color-scheme: light)').matches; }
    var root = document.documentElement;
    root.setAttribute('data-theme', isLight ? 'light' : 'dark');
    if (card) { root.style.setProperty('--card', 'rgb(' + card.r + ',' + card.g + ',' + card.b + ')'); }
    if (text) { root.style.setProperty('--text', 'rgb(' + text.r + ',' + text.g + ',' + text.b + ')'); }
})();
</script>

<style>
:root {
    --accent: #00CDAB;
    --card: #1b1d22;
    --text: #f4f6f8;
    --muted: #98a2b3;
    --track: rgba(255,255,255,0.16);
    --chip: rgba(255,255,255,0.07);
    --chip-border: rgba(255,255,255,0.13);
}
:root[data-theme="light"] {
    --card: #ffffff;
    --text: #111827;
    --muted: #5b6472;
    --track: rgba(17,24,39,0.16);
    --chip: rgba(17,24,39,0.05);
    --chip-border: rgba(17,24,39,0.13);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--card); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

.tile {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    gap: 5px;
    padding: 7px 9px;
    overflow: hidden;
}

/* ---------- Kopfzeile ---------- */
.head {
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0; min-width: 0; overflow: hidden;
}
.titles { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden; }
.title { font-size: 14px; font-weight: 700; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 11px; color: var(--muted); line-height: 1.2; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hbtn {
    flex: 0 0 auto; cursor: pointer; outline: none;
    width: 30px; height: 30px; padding: 0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1;
    background: var(--chip); color: var(--muted);
    border: 1px solid var(--chip-border);
    transition: background .15s ease, color .15s ease, border-color .15s ease;
    font-family: inherit;
}
.hbtn:active { transform: scale(0.94); }
.hbtn.on { background: color-mix(in srgb, var(--accent) 26%, transparent); color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.hbtn.mute-on { background: color-mix(in srgb, #ff6b6b 24%, transparent); color: #ff9a9a;
    border-color: rgba(255,107,107,0.45); }

/* ---------- Mittelteil ---------- */
.body { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center;
    gap: 5px; min-height: 0; overflow: hidden; }
.row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .lbl { font-size: 11px; color: var(--muted); width: 46px; flex: 0 0 auto; }
.value { font-size: 12px; font-variant-numeric: tabular-nums; width: 38px;
    text-align: right; flex: 0 0 auto; }

input[type=range] { -webkit-appearance: none; appearance: none; flex: 1 1 auto; min-width: 0;
    height: 22px; background: transparent; cursor: pointer; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--track); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none;
    width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: none;
    margin-top: -5.5px; }
input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: var(--track); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: none; }

select { flex: 1 1 auto; min-width: 0; cursor: pointer; outline: none;
    padding: 4px 7px; border-radius: 6px; font-size: 12px;
    background: var(--chip); color: var(--text); border: 1px solid var(--chip-border);
    font-family: inherit; }

/* ---------- Wiedergabe ---------- */
.foot { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.pbtn {
    flex: 1 1 0; min-width: 0; cursor: pointer; outline: none; padding: 0;
    border: 1px solid var(--chip-border); background: var(--chip); color: var(--text);
    border-radius: 7px; display: flex; align-items: center; justify-content: center;
    height: 30px; font-size: 14px; line-height: 1;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
    font-family: inherit;
}
.pbtn:active { transform: scale(0.95); filter: brightness(1.25); }
.pbtn.active { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 50%, transparent); }

.hide { display: none !important; }

/* ---------- Kleine Kacheln ---------- */
@media (max-height: 170px) {
    .foot { display: none; }
}
@media (max-height: 130px) {
    .body { justify-content: flex-start; }
    .row .lbl { display: none; }
}
@media (max-width: 220px) {
    .row .lbl { display: none; }
    .value { width: 32px; }
}
</style>
</head>
<body>
<div class="tile">

    <div class="head">
        <div class="titles">
            <div class="title" id="tTitle">Raumfeld</div>
            <div class="sub" id="tSub"></div>
        </div>
        <button class="hbtn" id="btnMute" title="Stumm">&#128263;</button>
        <button class="hbtn" id="btnPower" title="Ein/Aus">&#9211;</button>
    </div>

    <div class="body">
        <div class="row" id="rowVolume">
            <span class="lbl">Lautst.</span>
            <input type="range" id="vol" min="0" max="100" step="1">
            <span class="value" id="volVal">--</span>
        </div>
        <div class="row" id="rowSource">
            <span class="lbl">Quelle</span>
            <select id="src"></select>
        </div>
    </div>

    <div class="foot" id="rowPlay">
        <button class="pbtn" id="btnPrev" title="Zurueck">&#9198;</button>
        <button class="pbtn" id="btnPlay" title="Wiedergabe">&#9654;</button>
        <button class="pbtn" id="btnStop" title="Stop">&#9632;</button>
        <button class="pbtn" id="btnNext" title="Weiter">&#9197;</button>
    </div>

</div>

<script>
var state = { power: false, volume: 0, mute: false, source: 0, sources: {}, transport: '', status: '' };
var volTimer = null;

function setText(id, v) {
    var el = document.getElementById(id);
    if (el && el.textContent !== String(v)) { el.textContent = v; }
}

function buildSubtitle(p) {
    var parts = [];
    if (p.subtitle) { parts.push(p.subtitle); }
    if (p.status) { parts.push(p.status); }
    return parts.join(' \u00b7 ');
}

function handleMessage(data) {
    if (!data) { return; }
    var p = data;
    if (typeof data === 'string') {
        try { p = JSON.parse(data); } catch (e) { return; }
    }

    if (p.accentColor) { document.documentElement.style.setProperty('--accent', p.accentColor); }
    if (p.title !== undefined) { setText('tTitle', p.title); }

    var btnPower = document.getElementById('btnPower');
    var btnMute = document.getElementById('btnMute');

    if (!p.available) {
        setText('tSub', p.status || 'Keine Renderer-Instanz');
        btnPower.classList.remove('on');
        return;
    }

    state.power = !!p.power;
    state.volume = p.volume | 0;
    state.mute = !!p.mute;
    state.source = p.source | 0;
    state.sources = p.sources || {};
    state.transport = p.transport || '';
    state.status = p.status || '';

    setText('tSub', buildSubtitle(p));

    btnPower.classList.toggle('on', state.power);
    btnPower.innerHTML = state.power ? '&#9211;' : '&#9211;';
    btnMute.classList.toggle('mute-on', state.mute);
    btnMute.classList.toggle('hide', !p.showMute);

    document.getElementById('rowVolume').classList.toggle('hide', !p.showVolume);
    document.getElementById('rowSource').classList.toggle('hide', !p.showSource);
    document.getElementById('rowPlay').classList.toggle('hide', !p.showPlayback);

    if (!volTimer) {
        document.getElementById('vol').value = state.volume;
        setText('volVal', state.volume + ' %');
    }

    var sel = document.getElementById('src');
    var keys = Object.keys(state.sources);
    if (sel.options.length !== keys.length) {
        sel.innerHTML = keys.map(function (k) {
            return '<option value="' + k + '">' + state.sources[k] + '</option>';
        }).join('');
    }
    if (sel.value !== String(state.source)) { sel.value = String(state.source); }

    var playing = state.transport === 'PLAYING';
    var btnPlay = document.getElementById('btnPlay');
    btnPlay.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    btnPlay.classList.toggle('active', playing);
}

function send(ident, value) {
    if (typeof requestAction === 'function') {
        requestAction(ident, value);
    } else {
        console.log('[Preview] ' + ident + ' = ' + value);
    }
}

document.getElementById('btnPower').addEventListener('click', function () { send('power', !state.power); });
document.getElementById('btnMute').addEventListener('click', function () { send('mute', !state.mute); });

document.getElementById('vol').addEventListener('input', function () {
    setText('volVal', this.value + ' %');
    if (volTimer) { clearTimeout(volTimer); }
    volTimer = setTimeout(function () { volTimer = null; }, 1200);
});

document.getElementById('vol').addEventListener('change', function () {
    send('volume', parseInt(this.value, 10));
});

document.getElementById('src').addEventListener('change', function () {
    send('source', parseInt(this.value, 10));
});

document.getElementById('btnPrev').addEventListener('click', function () { send('playback', 0); });
document.getElementById('btnPlay').addEventListener('click', function () {
    send('playback', state.transport === 'PLAYING' ? 3 : 2);
});
document.getElementById('btnStop').addEventListener('click', function () { send('playback', 1); });
document.getElementById('btnNext').addEventListener('click', function () { send('playback', 4); });

if (window.__INITIAL_DATA__) { handleMessage(window.__INITIAL_DATA__); }
</script>
</body>
</html>
