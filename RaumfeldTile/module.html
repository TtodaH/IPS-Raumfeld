<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Raumfeld</title>
<script>
(function () {
    function parseHex(v) {
        if (!v) return null;
        var h = String(v).trim().replace('#', '');
        if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
        if (!/^[0-9a-f]{6}$/i.test(h)) return null;
        return { r: parseInt(h.substr(0,2),16), g: parseInt(h.substr(2,2),16), b: parseInt(h.substr(4,2),16) };
    }
    function lum(c) {
        function ch(x){ x/=255; return x<=0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055,2.4); }
        return 0.2126*ch(c.r)+0.7152*ch(c.g)+0.0722*ch(c.b);
    }
    var p = new URLSearchParams(location.search);
    var card = parseHex(p.get('cardcolor')), text = parseHex(p.get('textcolor'));
    var isLight = card ? lum(card) > 0.45 : (text ? lum(text) < 0.45 : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
    var root = document.documentElement;
    root.setAttribute('data-theme', isLight ? 'light' : 'dark');
    if (card) root.style.setProperty('--card', 'rgb('+card.r+','+card.g+','+card.b+')');
    if (text) root.style.setProperty('--text', 'rgb('+text.r+','+text.g+','+text.b+')');
})();
</script>
<style>
:root {
    --accent: #00CDAB;
    --text: #f4f6f8;
    --muted: #98a2b3;
    --track: rgba(255,255,255,.14);
    --row-bg: rgba(255,255,255,.04);
    --chip-b: rgba(255,255,255,.13);

    /* Skalierung per JS aus echter Kachelgroesse */
    --fs-sub: 14px;
    --fs-row: 15px;
    --fs-val: 15px;
    --icon: 20px;
    --gap: 10px;
    --pad-x: 14px;
    --spacer-h: 28px;
    --thumb: 24px;
    --track-h: 6px;
    --toggle-w: 52px;
    --toggle-h: 30px;
    --pbtn-h: 48px;
}
:root[data-theme="light"] {
    --text:#111827; --muted:#5b6472;
    --track: rgba(17,24,39,.14); --row-bg: rgba(17,24,39,.04); --chip-b: rgba(17,24,39,.13);
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; overflow:hidden; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: transparent; color: var(--text);
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}

/* Platzhalter fuer den Symcon-Titel oben */
.symcon-header-spacer { width:100%; flex:0 0 auto; height: var(--spacer-h); }

/* Kachel-Rahmen wie native Tiles: linker Akzentstrich + Inhalt */
.tile {
    width:100%; height:100%;
    padding: 4px var(--pad-x) 8px;
    display:flex; flex-direction:column; gap: var(--gap);
    min-height:0; overflow:hidden;
}
.content {
    flex:1 1 auto; min-height:0; display:flex; gap:10px; overflow:hidden;
}
.accent {
    flex:0 0 3px; border-radius:2px; background: var(--accent); opacity:.8;
}
.col { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap: var(--gap); justify-content:center; overflow:hidden; }

.sub { font-size: var(--fs-sub); color: var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Native Zeile: Icon + Label links, Control rechts */
.row {
    display:flex; align-items:center; gap:10px;
    min-width:0; flex:0 0 auto;
}
.ricon { flex:0 0 auto; width: var(--icon); text-align:center; font-size: var(--icon); color: var(--accent); line-height:1; }
.rlbl { flex:0 0 auto; font-size: var(--fs-row); white-space:nowrap; }
.rctl { flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:flex-end; gap:8px; }
.rval { flex:0 0 auto; font-size: var(--fs-val); font-variant-numeric: tabular-nums; color: var(--text); white-space:nowrap; }

/* Slider im Fritz-Stil: dicker Track, grosser runder Thumb, Akzentfuellung */
input[type=range] {
    -webkit-appearance:none; appearance:none;
    flex:1 1 auto; min-width:0; height: calc(var(--thumb) + 10px);
    margin:0; background:transparent; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track { height: var(--track-h); border-radius: calc(var(--track-h)/2); background: var(--track); }
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width: var(--thumb); height: var(--thumb); border-radius:50%;
    background: var(--accent); border:none; margin-top: calc((var(--track-h) - var(--thumb)) / 2);
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
}
input[type=range]::-moz-range-track { height: var(--track-h); border-radius: calc(var(--track-h)/2); background: var(--track); }
input[type=range]::-moz-range-thumb { width: var(--thumb); height: var(--thumb); border-radius:50%; background: var(--accent); border:none; }

/* Symcon-Toggle: Pill, Akzent wenn an */
.toggle {
    flex:0 0 auto; width: var(--toggle-w); height: var(--toggle-h); border-radius: calc(var(--toggle-h)/2);
    background: var(--track); border:none; padding:0; cursor:pointer; position:relative; outline:none;
    transition: background .18s ease;
}
.toggle::after {
    content:''; position:absolute; top:3px; left:3px;
    width: calc(var(--toggle-h) - 6px); height: calc(var(--toggle-h) - 6px);
    border-radius:50%; background:#fff; transition: left .18s ease;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
.toggle.on { background: var(--accent); }
.toggle.on::after { left: calc(var(--toggle-w) - var(--toggle-h) + 3px); }
:root[data-theme="light"] .toggle::after { background:#fff; }

/* Quelle als dezentes Select im Wert-Stil */
select {
    flex:0 1 auto; max-width:60%; min-width:0;
    padding: 6px 8px; border-radius:8px; border:none; background:transparent;
    font-size: var(--fs-val); font-family:inherit; color: var(--text);
    cursor:pointer; text-overflow:ellipsis; text-align:right;
    -webkit-appearance:none; appearance:none;
}
select:focus { outline:none; }

/* Wiedergabe-Zeile unten: 4 Buttons */
.playrow { display:flex; gap:8px; flex:0 0 auto; }
.pbtn {
    flex:1 1 0; min-width:0; height: var(--pbtn-h);
    border-radius:10px; border:1px solid var(--chip-b); background: var(--row-bg);
    color: var(--text); font-size: calc(var(--icon) * 1.1); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-family:inherit;
}
.pbtn:active { transform:scale(.95); filter:brightness(1.3); }
.pbtn.active { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

.hide { display:none !important; }

/* Inline SVG-Icons aus dem offiziellen Symcon-Iconset (/icons.js) */
.ic { width: 1em; height: 1em; fill: currentColor; display: inline-block; vertical-align: -0.12em; }
.ricon .ic { width: var(--icon); height: var(--icon); }
.pbtn .ic { width: calc(var(--icon) * 1.15); height: calc(var(--icon) * 1.15); }


/* Stufen: bei wenig Hoehe ausblenden */
body.lvl-tiny .playrow, body.lvl-tiny .row-source { display:none; }
body.lvl-micro .playrow, body.lvl-micro .row-source, body.lvl-micro .row-mute { display:none; }
body.lvl-micro .symcon-header-spacer { height: 14px; }
</style>
</head>

var ICON_VOL = ICONS.vol;
var ICON_MUTE = ICONS["vol-x"];

function applyLevel() {
    var root = document.documentElement;
    var h = root.clientHeight || window.innerHeight || 0;
    var w = root.clientWidth || window.innerWidth || 0;
    var b = document.body;
    var scale = Math.max(1.1, Math.min(1.7, Math.min(w / 320, h / 170)));
    var px = function (base) { return (base * scale).toFixed(1) + 'px'; };
    root.style.setProperty('--fs-sub', px(14));
    root.style.setProperty('--fs-row', px(15));
    root.style.setProperty('--fs-val', px(15));
    root.style.setProperty('--icon', Math.round(20 * scale) + 'px');
    root.style.setProperty('--gap', Math.round(10 * scale) + 'px');
    root.style.setProperty('--pad-x', Math.round(14 * scale) + 'px');
    root.style.setProperty('--thumb', Math.round(24 * scale) + 'px');
    root.style.setProperty('--track-h', Math.round(6 * scale) + 'px');
    root.style.setProperty('--toggle-w', Math.round(52 * scale) + 'px');
    root.style.setProperty('--toggle-h', Math.round(30 * scale) + 'px');
    root.style.setProperty('--pbtn-h', Math.round(48 * scale) + 'px');
    root.style.setProperty('--spacer-h', Math.round(Math.max(20, Math.min(h * 0.14, 40))) + 'px');
    b.classList.remove('lvl-tiny', 'lvl-micro');
    if (h > 0 && h < 130) b.classList.add('lvl-micro');
    else if (h > 0 && h < 190) b.classList.add('lvl-tiny');
}
if (window.ResizeObserver) new ResizeObserver(applyLevel).observe(document.documentElement);
window.addEventListener('resize', applyLevel);
window.addEventListener('load', applyLevel);
applyLevel();

function setText(id, v) { var el = document.getElementById(id); if (el && el.textContent !== String(v)) el.textContent = v; }

function handleMessage(data) {
    if (!data) return;
    var p = data;
    if (typeof data === 'string') { try { p = JSON.parse(data); } catch (e) { return; } }
    if (p.accentColor) document.documentElement.style.setProperty('--accent', p.accentColor);

    if (!p.available) {
        setText('tSub', p.status || 'Keine Renderer-Instanz');
        document.getElementById('btnPower').classList.remove('on');
        applyLevel();
        return;
    }

    state.power = !!p.power; state.volume = p.volume | 0; state.mute = !!p.mute;
    state.source = p.source | 0; state.sources = p.sources || {}; state.transport = p.transport || '';

    var parts = [];
    if (p.subtitle) parts.push(p.subtitle);
    if (p.status) parts.push(p.status);
    setText('tSub', parts.join(' \u00b7 '));

    document.getElementById('btnPower').classList.toggle('on', state.power);
    var btnMute = document.getElementById('btnMute');
    btnMute.classList.toggle('on', state.mute);
    document.getElementById('muteIcon').innerHTML = state.mute ? ICONS['vol-x'] : ICONS.vol;
    document.getElementById('volIcon').innerHTML = state.mute ? ICONS['vol-x'] : ICONS.vol;
    document.getElementById('rowMute').classList.toggle('hide', !p.showMute);
    document.getElementById('rowVolume').classList.toggle('hide', !p.showVolume);
    document.getElementById('rowSource').classList.toggle('hide', !p.showSource);
    document.getElementById('rowPlay').classList.toggle('hide', !p.showPlayback);
    document.getElementById('rowPower').classList.toggle('hide', false);

    if (!volTimer) {
        document.getElementById('vol').value = state.volume;
        setText('volVal', state.volume + ' %');
    }

    var sel = document.getElementById('src');
    var keys = Object.keys(state.sources);
    if (sel.options.length !== keys.length) {
        sel.innerHTML = keys.map(function (k) { return '<option value="'+k+'">'+state.sources[k]+'</option>'; }).join('');
    }
    if (sel.value !== String(state.source)) sel.value = String(state.source);

    var playing = state.transport === 'PLAYING';
    var btnPlay = document.getElementById('btnPlay');
    btnPlay.innerHTML = playing ? ICONS.pause : ICONS.play;
    btnPlay.classList.toggle('active', playing);
    applyLevel();
}

function send(ident, value) { if (typeof requestAction === 'function') requestAction(ident, value); }

document.getElementById('btnPower').addEventListener('click', function () { send('power', !state.power); });
document.getElementById('btnMute').addEventListener('click', function () { send('mute', !state.mute); });
document.getElementById('vol').addEventListener('input', function () {
    setText('volVal', this.value + ' %');
    if (volTimer) clearTimeout(volTimer);
    volTimer = setTimeout(function () { volTimer = null; }, 1200);
});
document.getElementById('vol').addEventListener('change', function () { send('volume', parseInt(this.value, 10)); });
document.getElementById('src').addEventListener('change', function () { send('source', parseInt(this.value, 10)); });
document.getElementById('btnPrev').addEventListener('click', function () { send('playback', 0); });
document.getElementById('btnPlay').addEventListener('click', function () { send('playback', state.transport === 'PLAYING' ? 3 : 2); });
document.getElementById('btnStop').addEventListener('click', function () { send('playback', 1); });
document.getElementById('btnNext').addEventListener('click', function () { send('playback', 4); });

if (window.__INITIAL_DATA__) handleMessage(window.__INITIAL_DATA__);
</script>
